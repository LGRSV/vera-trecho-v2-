<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14273f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missão PC-TO">
<title>Missão PC-TO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0e1b2c;--card:#162a43;--card2:#1c3453;--txt:#eef2f7;--mut:#9fb0c6;--gold:#d4a44a;--ok:#3fb27f;--bad:#e2605b;--line:#2a4566;
--r:14px;--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#14273f,#0e1b2cee);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;letter-spacing:.3px}header h1 b{color:var(--gold)}header small{color:var(--mut)}
main{padding:14px 14px calc(90px + var(--safe-b));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1626f2;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:6;backdrop-filter:blur(8px)}
nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:11px;padding:8px 2px}nav a span{display:block;font-size:20px}
nav a.on{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:16px}.card h3{margin:10px 0 6px;font-size:14px;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.kpi{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px;color:var(--gold)}.kpi small{color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 14px;background:var(--gold);color:#1b1404;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.full{width:100%}.btn:disabled{opacity:.45}
.mut{color:var(--mut)}.small{font-size:12.5px}.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);font-size:11.5px;margin:2px 4px 2px 0}
.tag.ok{background:#1f4a39;color:#bff0d8}.tag.warn{background:#4a3a1f;color:#ffe2a8}.tag.bad{background:#4a2323;color:#ffc9c6}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:14.5px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#173d2e}.opt.bad{border-color:var(--bad);background:#3d1c1c}
.list{list-style:none;margin:0;padding:0}.list li{padding:9px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}
input,select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;padding:16px;background:var(--card2);border-radius:14px;border:1px dashed var(--line)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));background:#223d60;border:1px solid var(--gold);border-radius:12px;padding:12px;z-index:9;box-shadow:0 8px 24px #0008}
.timer{font-size:48px;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums}
.texto{white-space:pre-line;background:var(--card2);border-radius:12px;padding:10px;font-size:14px}
a{color:var(--gold)}.center{text-align:center}
</style>
</head>
<body>
<header><h1>Missão <b>PC-TO</b></h1><small id="sub">Oficial Investigador · Cebraspe</small></header>
<main id="view"><div class="card">Carregando…</div></main>
<nav id="nav">
  <a href="#hoje"><span>🏠</span>Hoje</a>
  <a href="#estudar"><span>⚡</span>Estudar</a>
  <a href="#questoes"><span>📝</span>Questões</a>
  <a href="#plano"><span>🗓️</span>Plano</a>
  <a href="#lembretes"><span>🔔</span>Lembretes</a>
  <a href="#mais"><span>☰</span>Mais</a>
</nav>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
